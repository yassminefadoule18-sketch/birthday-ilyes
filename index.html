<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Ilyes 🚀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Lora:ital@0;1&display=swap">
<style>
:root{
  --bg:#05030f; --ink:#f6ecff; --soft:#c9b6e6; --glow:#ff9ed8; --gold:#ffd9a0;
  --card:rgba(30,20,55,.62); --line:rgba(255,200,240,.28);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif; --body:"Lora",Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05030f;--ink:#f6ecff}}
:root[data-theme="dark"]{--bg:#05030f;--ink:#f6ecff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(ellipse at 20% 10%,#2a1250 0,transparent 55%),radial-gradient(ellipse at 85% 90%,#3a0f48 0,transparent 55%),var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.planet{position:fixed;border-radius:50%;z-index:0;opacity:.85;animation:drift 18s ease-in-out infinite alternate}
.p1{width:110px;height:110px;top:9%;right:6%;background:radial-gradient(circle at 30% 30%,#ffd0a8,#c25a8e 55%,#3a1450);box-shadow:0 0 40px rgba(255,140,200,.35)}
.p2{width:64px;height:64px;bottom:12%;left:5%;background:radial-gradient(circle at 30% 30%,#b9d8ff,#5a62d6 55%,#1b1a4d);box-shadow:0 0 30px rgba(120,140,255,.4);animation-duration:14s}
.p2::after{content:"";position:absolute;left:-30%;top:42%;width:160%;height:14%;border:2px solid rgba(200,210,255,.55);border-radius:50%;transform:rotate(-18deg)}
@keyframes drift{to{transform:translateY(-22px) translateX(8px)}}
.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
.scene.on{opacity:1;visibility:visible}
.eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1,h2{font-family:var(--serif);font-style:italic;font-weight:700;margin:0;text-shadow:0 0 22px rgba(255,150,220,.55)}
h1{font-size:clamp(2.2rem,8vw,3.8rem);line-height:1.1}
h2{font-size:clamp(1.8rem,6vw,2.8rem);margin-bottom:18px}
p.sub{color:var(--soft);font-style:italic;margin:12px 0 26px}
.timer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.box{width:76px;padding:14px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.box b{display:block;font-family:var(--serif);font-size:2rem}
.box small{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.btn{margin-top:26px;font:inherit;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:rgba(255,150,220,.14);border:1px solid var(--line);border-radius:999px;padding:12px 26px;cursor:pointer;transition:.25s}
.btn:hover:not(:disabled){background:rgba(255,150,220,.3);box-shadow:0 0 24px rgba(255,150,220,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gift{font-size:6rem;cursor:pointer;background:none;border:0;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(255,170,120,.55))}
.gift.open{animation:pop .7s forwards}
@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
@keyframes pop{to{transform:scale(2.4);opacity:0}}
.card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;text-align:left;backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card p{margin:0 0 14px;line-height:1.75;font-size:.97rem}
.cur::after{content:"|";margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:18px;width:min(640px,100%);margin:6px 0 0}
.pol{background:#f7f1ea;padding:8px 8px 26px;border-radius:3px;transform:rotate(var(--r));box-shadow:0 10px 26px rgba(0,0,0,.55);opacity:0;animation:drop .7s forwards;animation-delay:var(--d)}
.pol div{aspect-ratio:1;background:linear-gradient(135deg,#3a1d63,#a1457f);display:grid;place-items:center;font-size:2rem;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(0)}to{opacity:1;transform:translateY(0) rotate(var(--r))}}
.wishes{list-style:none;margin:0;padding:0}
.wishes li{padding:18px 6px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.08rem;line-height:1.95;letter-spacing:.01em;color:var(--ink);text-shadow:0 0 18px rgba(255,150,220,.35);opacity:0;transform:translateY(10px);transition:opacity 1.4s,transform 1.4s}
.wishes li.show{opacity:1;transform:none}
.sign{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--glow);margin-top:18px}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;text-align:center;font-size:.7rem;color:var(--soft);opacity:.7;pointer-events:none}
</style>
</head>

    ["", "I wish you an ocean of happiness, a river of laughter, and a sky full of love. Wherever your journey takes you, may the stars keep watch over your soul."],
    ["", "I hope you know you are loved. I hope things get simpler for you, peaceful, and that you spend your days with easy breaths and soft words. You deserve light through your windowsill, and I hope it comes your way soon."]

/* ================================== */

var $ = function(i){return document.getElementById(i)};
var scenes = document.querySelectorAll(".scene");
function show(id){scenes.forEach(function(s){s.classList.toggle("on", s.id===id)})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* starfield + shooting stars */
(function(){
  var c=$("sky"), x=c.getContext("2d"), W, H, stars=[], shoots=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;stars=[];
    for(var i=0;i<Math.min(220,W*H/6000);i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,t:Math.random()*6,v:Math.random()*.02+.005})}
  addEventListener("resize",size);size();
  function frame(){
    x.clearRect(0,0,W,H);
    stars.forEach(function(s){s.t+=s.v;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.t));x.fillStyle="#fff";x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()});
    if(Math.random()<.008)shoots.push({x:Math.random()*W,y:Math.random()*H*.5,l:0});
    shoots=shoots.filter(function(s){
      s.l+=9;s.x-=9;s.y+=5;
      var g=x.createLinearGradient(s.x,s.y,s.x+s.l*.9,s.y-s.l*.5);
      g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(1,"rgba(255,255,255,0)");
      x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+Math.min(s.l,90)*.9,s.y-Math.min(s.l,90)*.5);x.stroke();
      return s.l<420;
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

/* typewriter */
async function typeInto(el, text, speed){
  for(var i=0;i<text.length;i++){el.textContent+=text[i];await sleep(speed)}
}

/* countdown */
var preview = location.hash === "#preview", tick;
$("cName").innerHTML = CONFIG.NAME + "’s Special Day<br>is Coming";
function pad(n){return String(n).padStart(2,"0")}
function update(){
  var diff = CONFIG.TARGET - new Date();
  if(diff<=0 || preview){clearInterval(tick);toGift();return}
  var t=Math.floor(diff/1000);
  $("d").textContent=pad(Math.floor(t/86400));
  $("h").textContent=pad(Math.floor(t%86400/3600));
  $("m").textContent=pad(Math.floor(t%3600/60));
  $("s").textContent=pad(t%60);
}
function toGift(){
  $("giftBtn").classList.remove("open");$("giftBtn").style.opacity=1;
  show("s-gift");$("hint").textContent="";
}
$("giftBtn").onclick=function(){
  this.classList.add("open");
  setTimeout(function(){show("s-letter");writeLetter()},700);
};

/* letter */
var writing=false;
async function writeLetter(){
  if(writing)return;writing=true;
  var box=$("letter");box.innerHTML="";$("toPhotos").style.display="none";
  for(var i=0;i<CONFIG.LETTER.length;i++){
    var p=document.createElement("p");p.className="cur";box.appendChild(p);
    await typeInto(p,CONFIG.LETTER[i],i===0?55:28);
    p.classList.remove("cur");await sleep(350);
  }
  $("toPhotos").style.display="inline-block";writing=false;
}
$("toPhotos").onclick=function(){buildWall();show("s-photos")};

/* photos */
function buildWall(){
  var w=$("wall");w.innerHTML="";
  var list=CONFIG.PHOTOS.length?CONFIG.PHOTOS:["📸","🚀","🎮","🌙","⭐","🎉"];
  list.forEach(function(it,i){
    var d=document.createElement("div");d.className="pol";
    d.style.setProperty("--r",((i*37%11)-5)+"deg");d.style.setProperty("--d",(i*.25)+"s");
    var inner=document.createElement("div");
    if(CONFIG.PHOTOS.length){var im=new Image();im.src=it;im.alt="";inner.appendChild(im)}else inner.textContent=it;
    d.appendChild(inner);w.appendChild(d);
  });
}
$("toWishes").onclick=function(){
  show("s-wishes");
  var ul=$("wishList");ul.innerHTML="";
  CONFIG.WISHES.forEach(function(wi,i){
    var li=document.createElement("li");li.textContent=wi[1];ul.appendChild(li);
    setTimeout(function(){li.classList.add("show")},600+i*2200);
  });
};

/* ending */
$("toEnd").onclick=async function(){
  show("s-end");
  var t=$("endTitle");t.textContent="";t.classList.add("cur");$("endSub").textContent="";$("sign").textContent="";
  await typeInto(t,CONFIG.END_TITLE,90);
  await sleep(300);$("endSub").textContent=CONFIG.END_SUB;
  await sleep(700);$("sign").textContent="— "+CONFIG.FROM+" ♥";
};
$("replay").onclick=function(){writing=false;toGift()};

/* start */
show("s-count");update();
if(!preview)tick=setInterval(update,1000);
</script>
